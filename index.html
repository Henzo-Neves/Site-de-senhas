<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Senha</title>
    <link rel="stylesheet" href="./estilo.css">
</head>

<body>

    <section class="conteudo">

        <div class="conteudo-titulo">

        <div class="conteudo-senha">

            <label for="senha">senha</label>

        <div class="parametro">

                Personalize as palavras

                    <h4 class="parametro--senha-titulo">
                        Números de caracteres
                    </h4>
                    <div class="parametro-senha-botoes">
                        <button class="parametro-senha_botao">-</button>
                        <p class="parametro-senha_texto">12</p>
                        <button class="parametro-senha_botao">+</button>

                    </div>
                </div>

                <div class="parametro--senha">
                    <h4 class="parametro--senha-titulo">
                        Características da senha
                    </h4>
                    <div class="parametro-checkbox">
                        <input type="checkbox" name="maiscúlo" id="" class="checkbox" checked>
            <label for=" maisculo">Maiúsculo</label>
                        <div>
                            <div class="parametro-checkbox">
                                <input type="checkbox" name="Minúsculo" id="" class="checkbox" checked>
                <label for=" maisculo">Minúsculo</label>
                            </div>
                            <div class="parametro-checkbox">
                                <input type="checkbox" name="Número" id="" class="checkbox" checked>
            <label for=" maisculo">Número</label>
                            </div>
                            <div class="parametro-checkbox">
                                <input type="checkbox" name="Número" id="" class="checkbox" checked>
            <label for=" maisculo">Simbolo</label>
                            </div>
                        </div>
                    </div>
                </div> 
                    <div class="parametro--senha">
                        <h4 class="parametro--senha-titulo">
                            Senha Fortuda
                        </h4>

                        <div class="barra"></div>
                        <div class="forca fraca media forte"></div>
                        <div class="paramatreo-senha-textos">

                            <p>Fraca</p>
                            <p>Média</p>
                            <p>Forte</p>

                        </div>
                    </div>


    </section>

    <script src="./main.js"></script>
</body>

</html>
